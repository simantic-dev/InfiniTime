# PineTime: stock InfiniTime built from this tree (scripts/build_infinitime.sh) at 0x0, no bootloader.
# The phone connects at 6 s and sets the time, pushes a notification at 10 s; the side button wakes the
# display at 32 s.
board: pinetime
machines:
  watch:
    mcu: NRF52832-QFAA
    overlay: overlay.board
    elf: ../out/infinitime.elf
    analog:
      - {adc: saadc, channel: 7, points: [[0, 1.95]]}
media:
  - type: ble
    connect: [watch.radio, watch.phone]
    pcap: ../out/ble.pcap
timeout: 40
