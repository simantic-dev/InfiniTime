# PineTime: stock InfiniTime built from this tree (scripts/build_infinitime.sh) at 0x0, no bootloader.
# The phone connects at 6 s and sets the time; the display times out at about 21 s. The side button wakes
# it at 45 s and, after it times out again, at 61 s. The phone pushes a notification at 78 s.
board: pinetime
machines:
  watch:
    mcu: NRF52832-QFAA
    overlay: overlay.board
    elf: ../out/infinitime.elf
    analog:
      - {adc: saadc, channel: 7, points: [[0, 1.95]]}
media:
  - type: ble
    connect: [watch.radio, watch.phone]
    pcap: ../out/ble.pcap
timeout: 100
